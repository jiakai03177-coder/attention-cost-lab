[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-cost-lab"
version = "0.4.0"
description = "Estimate Transformer attention FLOPs, KV cache size, and decode memory pressure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jiakai03177-coder" }]
keywords = [
  "transformer",
  "attention",
  "inference",
  "kv-cache",
  "llm",
  "profiling"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
attention-cost = "attention_cost_lab.cli:main"

[tool.setuptools.packages.find]
include = ["attention_cost_lab*"]
